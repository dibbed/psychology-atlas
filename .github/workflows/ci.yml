name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "1"
      DB_ENGINE: sqlite
      SQLITE_PATH: ./data/ci.sqlite3
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Seed deterministic baseline
        run: python manage.py seed_mvp

      - name: Audit clinical-case graph and runtime state
        run: python manage.py audit_case_graphs

      - name: Run backend test suite
        run: python manage.py test atlas --noinput

      - name: Compile Python modules
        run: python -m compileall -q atlas config

      - name: Verify installed Python dependencies
        run: python -m pip check

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject tracked local secrets and databases
        shell: bash
        run: |
          set -euo pipefail

          bad_env="$(git ls-files | grep -E '(^|/)\.env($|\.local$)' || true)"
          bad_db="$(git ls-files | grep -E '\.(sqlite3|db)$' || true)"
          bad_keys="$(git ls-files | grep -Ei '(^|/)(id_rsa|id_ed25519|.*\.(pem|p12|pfx|key))$' || true)"

          if [[ -n "$bad_env" || -n "$bad_db" || -n "$bad_keys" ]]; then
            echo "Tracked sensitive/local-only files detected."
            [[ -n "$bad_env" ]] && printf 'Environment files:\n%s\n' "$bad_env"
            [[ -n "$bad_db" ]] && printf 'Database files:\n%s\n' "$bad_db"
            [[ -n "$bad_keys" ]] && printf 'Private key/certificate files:\n%s\n' "$bad_keys"
            exit 1
          fi

      - name: Reject machine-specific absolute paths
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '([A-Za-z]:\\Users\\[^\\]+\\|/Users/[^/]+/|/home/[^/]+/)' -- . ':!.github/workflows/ci.yml'; then
            echo "Machine-specific absolute path detected in tracked content."
            exit 1
          fi

      - name: Verify usage notice is present
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'No open-source license is granted' README.md
