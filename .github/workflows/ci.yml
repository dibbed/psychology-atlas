name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "1"
      DB_ENGINE: sqlite
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate SQLite runtime and test databases
        run: |
          echo "SQLITE_PATH=$RUNNER_TEMP/atlas-backend-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sqlite3" >> "$GITHUB_ENV"
          echo "SQLITE_TEST_PATH=$RUNNER_TEMP/atlas-backend-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sqlite3" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Seed deterministic baseline
        run: python manage.py seed_mvp

      - name: Audit clinical-case graph and runtime state
        run: python manage.py audit_case_graphs

      - name: Run backend test suite
        run: python manage.py test atlas --noinput

      - name: Validate curated Brain dossier without publication
        run: |
          python ../scripts/validate_brain_dossier.py --self-test
          python ../scripts/validate_brain_dossier.py \
            --dossier ../docs/research/brain/v0.9.2b/psychology_atlas_brain_curated_dossier_v0.9.2b.json \
            --database "$SQLITE_PATH" \
            --output "$RUNNER_TEMP/brain-dossier-validation"

      - name: Compile Python modules
        run: python -m compileall -q atlas config

      - name: Publish approved Brain selection in disposable CI database
        run: |
          python manage.py publish_curated_brain --expected-dossier-sha256 50b6e33e25b76a77b6ef735503487ac5fab7832d7474e45ad6beb7acdc25a557 --expected-manifest-sha256 3f3538fd4f8195b0dbe1c8631d61674cd84c629e7bea1018ba29b91329a3920d --dry-run
          python manage.py publish_curated_brain --expected-dossier-sha256 50b6e33e25b76a77b6ef735503487ac5fab7832d7474e45ad6beb7acdc25a557 --expected-manifest-sha256 3f3538fd4f8195b0dbe1c8631d61674cd84c629e7bea1018ba29b91329a3920d --apply
          python manage.py verify_brain_publication
          python manage.py verify_research_datasets

      - name: Verify installed Python dependencies
        run: python -m pip check

      - name: Validate and publish the reviewed Assessment selection in disposable SQLite
        run: |
          python manage.py import_assessment_dataset ../docs/research/assessments/v0.9.4/curated_dossier.json --dry-run
          python manage.py publish_curated_assessments
          python manage.py publish_curated_assessments --apply
          python manage.py publish_curated_assessments --apply
          python manage.py audit_assessments
          python manage.py verify_research_datasets
          python ../scripts/profile_assessments.py ./data/assessment-profile-sqlite.json

  brain-postgresql:
    name: Brain PostgreSQL publication and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: brain_publication_test
          POSTGRES_USER: brain_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brain_test -d brain_publication_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "1"
      DB_ENGINE: postgres
      POSTGRES_DB: brain_publication_test
      POSTGRES_USER: brain_test
      POSTGRES_PASSWORD: disposable-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Isolate fallback SQLite paths
        run: |
          echo "SQLITE_PATH=$RUNNER_TEMP/atlas-pg-fallback-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sqlite3" >> "$GITHUB_ENV"
          echo "SQLITE_TEST_PATH=$RUNNER_TEMP/atlas-pg-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sqlite3" >> "$GITHUB_ENV"
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install PostgreSQL test driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Publish and profile the reviewed Assessment selection on PostgreSQL
        run: |
          python manage.py migrate --noinput
          python manage.py publish_curated_assessments --apply
          python manage.py audit_assessments
          python ../scripts/profile_assessments.py ./data/assessment-profile-postgres.json

      - name: Global Search and Knowledge Graph reviewed corpus profile
        run: |
          python manage.py publish_curated_brain --expected-dossier-sha256 50b6e33e25b76a77b6ef735503487ac5fab7832d7474e45ad6beb7acdc25a557 --expected-manifest-sha256 3f3538fd4f8195b0dbe1c8631d61674cd84c629e7bea1018ba29b91329a3920d --dry-run
          python manage.py publish_curated_brain --expected-dossier-sha256 50b6e33e25b76a77b6ef735503487ac5fab7832d7474e45ad6beb7acdc25a557 --expected-manifest-sha256 3f3538fd4f8195b0dbe1c8631d61674cd84c629e7bea1018ba29b91329a3920d --apply
          python manage.py verify_brain_publication
          python ../scripts/profile_atlas_integration.py ./data/atlas-integration-profile-postgres.json --query-plans

      - name: Brain regression and concurrent controlled publication tests
        run: python manage.py test atlas.tests_v092c_brain_publication atlas.tests_v092_brain_api atlas.tests_v092_brain_staging atlas.tests_v092_brain_relations atlas.tests_v091_brain --noinput --verbosity 2 --durations 10 --timing

      - name: Assessment regression, migration and concurrent controlled publication tests
        run: python manage.py test atlas.tests_v094_assessments atlas.tests_v094_assessment_migrations --noinput --verbosity 2 --durations 10 --timing

      - name: Global Search and Knowledge Graph integration tests
        env:
          PYTHONUNBUFFERED: "1"
          PGOPTIONS: "-c statement_timeout=60000 -c lock_timeout=15000"
        run: python manage.py test atlas.tests_v095_integration atlas.tests.V063KnowledgeApiTests --noinput --verbosity 2 --durations 10 --timing

      - name: Admin security, revision, audit, migration and concurrency tests
        run: python manage.py test atlas.tests_v100_p01 atlas.tests_v100_p02 atlas.tests_v100_p03 atlas.tests_v100_p04 atlas.tests_v100_p05_sources atlas.tests_v100_p05_governance atlas.tests_v100_p05_integration atlas.tests_v100_p05_public atlas.tests_v100_p06_jobs atlas.tests_v100_p06_artifacts atlas.tests_v100_p06_research atlas.tests_v100_p06_integration atlas.tests_v100_p07_domains atlas.tests_v100_p07_content atlas.tests_v100_p07_integration atlas.tests_v100_p08_therapy atlas.tests_v100_p12_case_preview atlas.tests_v100_p16_case_publication atlas.tests_v100_p16_publication_preflight atlas.tests.V075CaseConcurrencyTests --noinput --verbosity 2 --timing


      - name: Learning editor metadata and history preservation
        run: python manage.py test atlas.tests_v100_p13_learning atlas.tests_v100_p13_flashcards atlas.tests_v100_p13_practice atlas.tests_v100_p13_archive atlas.tests_v100_p13_learning_io --noinput --verbosity 2 --timing

      - name: Account roles and purpose-bound privacy
        run: python manage.py test atlas.tests_v100_p14_users atlas.tests_v100_p14_privacy atlas.tests_v100_p14_privacy_export --noinput --verbosity 2 --timing

      - name: Controlled study operations and learner lifecycle
        run: python manage.py test atlas.tests_v100_p15_actions atlas.tests_v100_p15_study_ops atlas.tests.V081StudyPlanningFoundationTests atlas.tests.V082StudyBlockSchedulerTests atlas.tests_v084_sessions --noinput --verbosity 2 --timing

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: P07 typed authoring and transport checks
        run: node components/cms/CmsDomains.test.cjs

      - name: Assessment navigation checks
        run: node --experimental-strip-types app/assessments/assessment.selfcheck.mjs

      - name: Production build
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

  browser-release-qa:
    name: Browser release QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG: "1"
      DB_ENGINE: sqlite
      PYTHONUNBUFFERED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8015/api
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3015
      DRF_ANON_RATE: 20000/min
    steps:
      - name: Configure disposable runner paths
        run: |
          echo "SQLITE_PATH=$RUNNER_TEMP/browser-release.sqlite3" >> "$GITHUB_ENV"
          echo "SQLITE_TEST_PATH=$RUNNER_TEMP/browser-release-tests.sqlite3" >> "$GITHUB_ENV"
          echo "EMPTY_SQLITE_PATH=$RUNNER_TEMP/browser-empty.sqlite3" >> "$GITHUB_ENV"
          echo "BROWSER_QA_OUTPUT=$RUNNER_TEMP/browser-qa" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/browser-tools/node_modules" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing backend and frontend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Install pinned isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-package-lock --ignore-scripts playwright@1.64.0
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Prepare reproducible reviewed and empty validation databases
        working-directory: backend
        run: |
          SQLITE_PATH="$EMPTY_SQLITE_PATH" python manage.py migrate --noinput
          python manage.py migrate --noinput
          python manage.py seed_mvp
          python manage.py publish_curated_brain --expected-dossier-sha256 50b6e33e25b76a77b6ef735503487ac5fab7832d7474e45ad6beb7acdc25a557 --expected-manifest-sha256 3f3538fd4f8195b0dbe1c8631d61674cd84c629e7bea1018ba29b91329a3920d --apply
          python manage.py publish_curated_assessments --apply
          python manage.py audit_brain_atlas
          python manage.py audit_assessments
          python manage.py verify_brain_publication
          python manage.py verify_research_datasets
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Run all existing browser harnesses and scoped accessibility smoke
        run: node scripts/release_browser_qa.cjs
      - name: Build and exercise the real CMS journey
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8023/api
          CMS_QA_PYTHON: python
          CMS_QA_OUTPUT: ${{ runner.temp }}/browser-qa/cms
        run: |
          npm run build --prefix frontend
          export CMS_QA_BUILD_ID="$(cat frontend/.next/BUILD_ID)"
          node scripts/cms_browser_qa.cjs
          node scripts/cms_review_browser_qa.cjs
          node scripts/cms_governance_browser_qa.cjs
          node scripts/cms_intake_browser_qa.cjs
          CMS_QA_PHASE=p07 CMS_QA_PYTHON=python CMS_QA_ORIGIN=http://127.0.0.1:3023 CMS_QA_API_ORIGIN=http://127.0.0.1:8023 CMS_QA_OUTPUT="$RUNNER_TEMP/browser-qa/cms-p07" node scripts/cms_p07_browser_qa.cjs
          CMS_QA_PHASE=p08 CMS_QA_PYTHON=python CMS_QA_ORIGIN=http://127.0.0.1:3023 CMS_QA_API_ORIGIN=http://127.0.0.1:8023 CMS_QA_OUTPUT="$RUNNER_TEMP/browser-qa/cms-p08" node scripts/cms_p08_browser_qa.cjs
          CMS_QA_PHASE=p12 CMS_QA_PYTHON=python CMS_QA_ORIGIN=http://127.0.0.1:3023 CMS_QA_API_ORIGIN=http://127.0.0.1:8023 CMS_QA_OUTPUT="$RUNNER_TEMP/browser-qa/cms-p12" node scripts/cms_p12_browser_qa.cjs
          CMS_QA_PHASE=p13 CMS_QA_PYTHON=python CMS_QA_ORIGIN=http://127.0.0.1:3023 CMS_QA_API_ORIGIN=http://127.0.0.1:8023 CMS_QA_OUTPUT="$RUNNER_TEMP/browser-qa/cms-p13" node scripts/cms_p13_browser_qa.cjs
          CMS_QA_PHASE=p14 CMS_QA_PYTHON=python CMS_QA_ORIGIN=http://127.0.0.1:3023 CMS_QA_API_ORIGIN=http://127.0.0.1:8023 CMS_QA_OUTPUT="$RUNNER_TEMP/browser-qa/cms-p14" node scripts/cms_p14_browser_qa.cjs
      - name: Preserve browser evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-release-qa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/browser-qa
            qa/p05-browser
          if-no-files-found: warn
          retention-days: 14

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject tracked local secrets and databases
        shell: bash
        run: |
          set -euo pipefail

          bad_env="$(git ls-files | grep -E '(^|/)\.env($|\.local$)' || true)"
          bad_db="$(git ls-files | grep -E '\.(sqlite3|db)$' || true)"
          bad_keys="$(git ls-files | grep -Ei '(^|/)(id_rsa|id_ed25519|.*\.(pem|p12|pfx|key))$' || true)"

          if [[ -n "$bad_env" || -n "$bad_db" || -n "$bad_keys" ]]; then
            echo "Tracked sensitive/local-only files detected."
            [[ -n "$bad_env" ]] && printf 'Environment files:\n%s\n' "$bad_env"
            [[ -n "$bad_db" ]] && printf 'Database files:\n%s\n' "$bad_db"
            [[ -n "$bad_keys" ]] && printf 'Private key/certificate files:\n%s\n' "$bad_keys"
            exit 1
          fi

      - name: Reject machine-specific absolute paths
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '([A-Za-z]:\\Users\\[^\\]+\\|/Users/[^/]+/|/home/[^/]+/)' -- . ':!.github/workflows/ci.yml'; then
            echo "Machine-specific absolute path detected in tracked content."
            exit 1
          fi

      - name: Verify usage notice is present
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'No open-source license is granted' README.md
